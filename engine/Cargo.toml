[package]
name = "barrage"
version = "0.1.0"
edition = "2024"
description = "BitTorrent And Range Retrieval Across Grouped Egress: a multi-link download engine"
publish = false

[dependencies]
anyhow = "1.0.104"
if-addrs = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
