[package]
name = "barrage"
version = "0.1.0"
edition = "2024"
description = "BitTorrent And Range Retrieval Across Grouped Egress: a multi-link download engine"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
dns-lookup = "4.0.2"
# A Retry-After can be an HTTP date, in any of HTTP's three forms. Already in
# the tree through hyper, so no new code is fetched.
httpdate = "1.0.3"
if-addrs = "0.15.0"
open = "5.4.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
tower-http = { version = "0.6.11", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

# brg-links redraws its table in place, which a Windows console only allows
# once asked. A finished download is named with MoveFileExW, which unlike
# std's rename never replaces a file. Downloads go to the user's Downloads
# folder, wherever they have moved it, which only SHGetKnownFolderPath
# knows. Already in the tree through tokio, so no new code is fetched.
# Whether a link is metered is a connection profile's cost, which only the
# WinRT `NetworkInformation` API gives, so `windows`, not `windows-sys`.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Networking_Connectivity", "Foundation_Collections"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com"] }

[dev-dependencies]
futures-util = "0.3.34"
tokio-tungstenite = "0.29"
